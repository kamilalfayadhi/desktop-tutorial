name: MaxEnt – Iraqi bulbul

# Runs the full pipeline (GBIF download -> WorldClim -> MaxEnt -> maps -> report) on GitHub's
# runners and commits the results to maxent_iraqi_bulbul/outputs/ on the same branch.
on:
  workflow_dispatch:
  push:
    paths:
      - "maxent_iraqi_bulbul/**"
      - "!maxent_iraqi_bulbul/outputs/**"
      - ".github/workflows/maxent.yml"

permissions:
  contents: write

concurrency:
  group: maxent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: maxent_iraqi_bulbul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: maxent_iraqi_bulbul/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-test on synthetic data
        run: python tests/run_self_test.py

      - name: Cache WorldClim downloads
        uses: actions/cache@v4
        with:
          path: maxent_iraqi_bulbul/data/cache
          key: worldclim-${{ hashFiles('maxent_iraqi_bulbul/config.yaml') }}
          restore-keys: worldclim-

      - name: Run MaxEnt pipeline
        run: python run_pipeline.py

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: maxent-outputs
          path: maxent_iraqi_bulbul/outputs

      - name: Commit outputs to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs
          git commit -m "MaxEnt results from workflow run ${{ github.run_number }} [skip ci]" || echo "No changes"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
